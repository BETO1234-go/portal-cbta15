<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Bien - CBTA 15</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 24px 16px;
        }
        .bien-card {
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }
        .bien-card-header {
            background: var(--primary);
            color: #fff;
            padding: 20px 24px;
            text-align: center;
        }
        .bien-card-header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 2px;
            color: #fff;
        }
        .bien-card-header p {
            font-size: 0.8rem;
            opacity: 0.85;
            margin: 0;
        }
        .bien-card-header .no-inventario {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 8px;
            letter-spacing: 1px;
        }
        .bien-card-body {
            padding: 24px;
        }
        .bien-detail-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }
        .bien-detail-row:last-child {
            border-bottom: none;
        }
        .bien-detail-label {
            font-size: 0.78rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            min-width: 120px;
        }
        .bien-detail-value {
            font-size: 0.92rem;
            color: var(--text);
            font-weight: 500;
            text-align: right;
            word-break: break-word;
        }
        .bien-qr-section {
            text-align: center;
            padding: 20px 24px;
            border-top: 1px solid var(--border);
        }
        .bien-qr-section img {
            max-width: 180px;
            border: 4px solid var(--surface);
            border-radius: 8px;
        }
        .bien-qr-section p {
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 8px;
            word-break: break-all;
        }
        .bien-card-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .bien-card-footer a,
        .bien-card-footer button {
            font-family: 'Poppins', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
        }
        .btn-back {
            background: var(--primary-soft);
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-back:hover {
            background: var(--primary);
            color: #fff;
        }
        .btn-print {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-print:hover {
            background: var(--hover);
        }
        .bien-not-found {
            text-align: center;
            padding: 60px 24px;
            color: var(--muted);
        }
        .bien-not-found i {
            font-size: 3rem;
            margin-bottom: 12px;
            display: block;
        }
        .estado {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .estado.disponible { background: var(--success-bg); color: var(--success-text); }
        .estado.asignado { background: var(--info-bg); color: var(--info-text); }
        .estado.pendiente { background: var(--warning-bg); color: var(--warning); }
        .estado.baja { background: var(--danger-bg); color: var(--danger); }
        .estado.en\ revision, .estado.en-revision { background: var(--warning-bg); color: var(--warning); }
        .estado.en\ mantenimiento, .estado.en-mantenimiento { background: var(--info-bg); color: var(--info-text); }
        .estado.danado { background: var(--danger-bg); color: var(--danger); }

        @media print {
            body { padding: 0; background: #fff; }
            .bien-card { box-shadow: none; border: none; }
            .bien-card-footer, .bien-qr-section a { display: none !important; }
        }
        @media (max-width: 480px) {
            .bien-detail-row { flex-direction: column; gap: 2px; }
            .bien-detail-value { text-align: left; }
        }
    </style>
</head>
<body>
    <div id="bienContainer" class="bien-card">
        <div class="bien-not-found" id="bienLoading">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <p>Cargando informaci&oacute;n del bien...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            var theme = localStorage.getItem('portal-theme');
            if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();

        var SUPABASE_URL = 'https://fqfrqwyoehxakesfwhpw.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_IdH-OaL4gU8rAIzhk3-iAw_ZIBsiTT1';
        var BASE_PUBLIC_URL = 'https://beto1234-go.github.io/portal-cbta15/inventario/public/bien.html';

        var container = document.getElementById('bienContainer');

        function showError(msg) {
            container.innerHTML =
                '<div class="bien-not-found">' +
                    '<i class="fa-solid fa-triangle-exclamation"></i>' +
                    '<p>' + msg + '</p>' +
                    '<a href="../index.html" class="btn-back" style="margin-top:16px;"><i class="fa-solid fa-arrow-left"></i> Volver al inventario</a>' +
                '</div>';
        }

        function formatDate(d) {
            if (!d) return 'N/A';
            var dt = new Date(d);
            return dt.toLocaleDateString('es-MX', { day: '2-digit', month: 'long', year: 'numeric' });
        }

        async function loadBien() {
            var params = new URLSearchParams(window.location.search);
            var id = params.get('id');
            if (!id) { showError('No se especific&oacute; un bien.'); return; }

            try {
                var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                var result = await client.from('inv_bienes')
                    .select('*, inv_areas!id_area(nombre_area), inv_personal!id_personal(nombre, apellido_paterno, apellido_materno), inv_marcas!id_marca(nombre_marca)')
                    .eq('id', id)
                    .eq('eliminado', false)
                    .single();

                if (result.error || !result.data) {
                    showError('Bien no encontrado o no disponible.');
                    return;
                }

                var b = result.data;
                var marca = (b.inv_marcas && b.inv_marcas.nombre_marca) || 'N/A';
                var area = (b.inv_areas && b.inv_areas.nombre_area) || 'Sin &aacute;rea';
                var persona = '';
                if (b.inv_personal) {
                    persona = [b.inv_personal.nombre, b.inv_personal.apellido_paterno, b.inv_personal.apellido_materno].filter(Boolean).join(' ');
                }
                var qrUrl = BASE_PUBLIC_URL + '?id=' + b.id;
                var qrImg = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(qrUrl);

                var html =
                    '<div class="bien-card-header">' +
                        '<h1>CBTA No. 15</h1>' +
                        '<p>Sistema de Inventario</p>' +
                        '<div class="no-inventario">' + (b.no_inventario || 'N/A') + '</div>' +
                    '</div>' +
                    '<div class="bien-card-body">' +
                        detailRow('Nombre del bien', b.nombre_bien || 'N/A') +
                        detailRow('Marca', marca) +
                        detailRow('Modelo', b.modelo || 'N/A') +
                        detailRow('Serie', b.serie || 'N/A') +
                        detailRow('&Aacute;rea', area) +
                        detailRow('Responsable', persona || 'Sin asignar') +
                        detailRow('Estado', '<span class="estado ' + (b.estatus || '').toLowerCase().replace(/\s+/g, '-') + '">' + (b.estatus || 'N/A') + '</span>') +
                        detailRow('Valor', b.valor ? '$' + parseFloat(b.valor).toLocaleString('es-MX', { minimumFractionDigits: 2 }) : 'N/A') +
                        detailRow('Fecha de registro', formatDate(b.created_at)) +
                    '</div>' +
                    '<div class="bien-card-footer">' +
                        '<a href="../index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Volver al inventario</a>' +
                        '<button class="btn-print" onclick="window.print()"><i class="fa-solid fa-print"></i> Imprimir</button>' +
                    '</div>';

                container.innerHTML = html;
                document.title = (b.no_inventario || 'Bien') + ' - Detalle';
            } catch (err) {
                console.error(err);
                showError('Error al cargar el bien. Intente m&aacute;s tarde.');
            }
        }

        function detailRow(label, value) {
            return '<div class="bien-detail-row">' +
                '<span class="bien-detail-label">' + label + '</span>' +
                '<span class="bien-detail-value">' + value + '</span>' +
            '</div>';
        }

        loadBien();
    </script>
</body>
</html>
