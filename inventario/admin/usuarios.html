<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Inventario Escolar</title>
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{--primary:#1a73e8;--primary-hover:#1557b0;--bg:#f0f2f5;--surface:#fff;--text:#1f2937;--text-muted:#6b7280;--border:#e5e7eb;--sidebar-bg:#fff;--sidebar-width:260px;--danger:#dc2626;--success:#16a34a;--warning:#f59e0b;--info:#0ea5e9}
        body.dark{--primary:#4dabf7;--primary-hover:#339af0;--bg:#1a1a2e;--surface:#16213e;--text:#e4e6eb;--text-muted:#adb5bd;--border:#2d3748;--sidebar-bg:#0f1629;--danger:#fc5c65;--success:#26de81;--warning:#fed330;--info:#4bcffa}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;transition:background .3s,color .3s}
        .sidebar{width:var(--sidebar-width);background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;transition:background .3s,border-color .3s}
        .sidebar-header{padding:24px 20px;border-bottom:1px solid var(--border)}
        .sidebar-header h2{font-size:1.15rem;color:var(--primary);display:flex;align-items:center;gap:10px}
        .sidebar-header h2 i{font-size:1.3rem}
        .sidebar-header p{font-size:.8rem;color:var(--text-muted);margin-top:4px}
        .sidebar-nav{flex:1;overflow-y:auto;padding:12px 0}
        .sidebar-nav a{display:flex;align-items:center;gap:12px;padding:12px 20px;color:var(--text-muted);text-decoration:none;font-size:.95rem;transition:all .2s;border-left:3px solid transparent}
        .sidebar-nav a:hover{background:var(--bg);color:var(--text)}
        .sidebar-nav a.active{background:rgba(26,115,232,.08);color:var(--primary);border-left-color:var(--primary);font-weight:600}
        body.dark .sidebar-nav a.active{background:rgba(77,171,247,.1)}
        .sidebar-nav a i{width:20px;text-align:center;font-size:1rem}
        .sidebar-footer{padding:16px 20px;border-top:1px solid var(--border)}
        .sidebar-footer .user-info{font-size:.85rem;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .sidebar-footer .user-info i{color:var(--primary)}
        .sidebar-footer .footer-actions{display:flex;align-items:center;gap:8px}
        .sidebar-footer button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s}
        .sidebar-footer button:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
        .sidebar-footer .btn-logout:hover{background:var(--danger);border-color:var(--danger)}
        .main-content{margin-left:var(--sidebar-width);flex:1;padding:32px;min-height:100vh}
        .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px}
        .page-header h1{font-size:1.8rem;color:var(--text)}
        .page-header h1 i{color:var(--primary);margin-right:8px}
        .header-actions{display:flex;gap:10px;flex-wrap:wrap}
        .btn{padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.9rem;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:all .2s;text-decoration:none}
        .btn:hover{background:var(--bg)}
        .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
        .btn-primary:hover{background:var(--primary-hover)}
        .btn-danger{color:var(--danger);border-color:var(--danger)}
        .btn-danger:hover{background:var(--danger);color:#fff}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;transition:background .3s,border-color .3s}
        .table-container{overflow-x:auto}
        table{width:100%;border-collapse:collapse}
        table th,table td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:.88rem}
        table th{font-weight:600;color:var(--text-muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;background:var(--bg)}
        table tr:hover td{background:rgba(26,115,232,.03)}
        body.dark table tr:hover td{background:rgba(77,171,247,.05)}
        .badge{padding:4px 10px;border-radius:20px;font-size:.76rem;font-weight:600;display:inline-block;white-space:nowrap}
        .badge-success{background:rgba(22,163,74,.12);color:#16a34a}
        .badge-info{background:rgba(14,165,233,.12);color:#0ea5e9}
        .action-btns{display:flex;gap:6px}
        .action-btns button{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all .2s}
        .action-btns button:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
        .action-btns button.btn-del:hover{background:var(--danger);border-color:var(--danger)}
        .empty-state{text-align:center;padding:48px 20px;color:var(--text-muted)}
        .empty-state i{font-size:3rem;margin-bottom:12px;display:block;opacity:.4}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
        .modal-overlay.show{display:flex}
        .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:32px;position:relative;transition:background .3s,border-color .3s}
        .modal h2{font-size:1.3rem;color:var(--text);margin-bottom:24px;display:flex;align-items:center;gap:10px}
        .modal h2 i{color:var(--primary)}
        .modal-close{position:absolute;top:20px;right:20px;background:none;border:none;font-size:1.3rem;color:var(--text-muted);cursor:pointer;transition:color .2s}
        .modal-close:hover{color:var(--danger)}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:.85rem;color:var(--text)}
        .form-group label .req{color:var(--danger)}
        .form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.95rem;outline:none;transition:border .3s}
        .form-group input:focus,.form-group select:focus{border-color:var(--primary)}
        .form-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
        @media(max-width:768px){.sidebar{display:none}.main-content{margin-left:0;padding:20px}.page-header{flex-direction:column;align-items:flex-start}}
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-boxes-stacked"></i> Inventario</h2>
            <p>CBTA 15</p>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="bienes.html"><i class="fas fa-box-open"></i> Bienes</a>
            <a href="personal.html"><i class="fas fa-users"></i> Personal</a>
            <a href="areas.html"><i class="fas fa-building"></i> Areas</a>
            <a href="asignaciones.html"><i class="fas fa-link"></i> Asignaciones</a>
            <a href="historial.html"><i class="fas fa-clock-rotate-left"></i> Historial</a>
            <a href="reportes.html"><i class="fas fa-file-lines"></i> Reportes</a>
            <a href="pendientes.html"><i class="fas fa-hourglass-half"></i> Pendientes</a>
            <a href="usuarios.html" class="active"><i class="fas fa-user-shield"></i> Usuarios</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info" id="userInfo">
                <i class="fas fa-user-circle"></i>
                <span id="userName">Cargando...</span>
            </div>
            <div class="footer-actions">
                <button onclick="toggleTheme()" id="themeBtn" title="Cambiar tema">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <button class="btn-logout" onclick="handleLogout()" title="Cerrar sesion">
                    <i class="fas fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-user-shield"></i> Usuarios del Sistema</h1>
            <div class="header-actions">
                <button class="btn btn-primary admin-only" onclick="openModal()">
                    <i class="fas fa-plus"></i> Nuevo Usuario
                </button>
            </div>
        </div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Fecha</th>
                            <th>Accion</th>
                        </tr>
                    </thead>
                    <tbody id="usuariosTableBody">
                        <tr>
                            <td colspan="5" class="empty-state">
                                <i class="fas fa-user-shield"></i>
                                Cargando usuarios...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="usuarioModal">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2><i class="fas fa-user-plus"></i> Nuevo Usuario</h2>
            <form id="usuarioForm" onsubmit="handleUsuarioSubmit(event)">
                <div class="form-group">
                    <label>Nombre <span class="req">*</span></label>
                    <input type="text" id="nombre" required placeholder="Nombre completo">
                </div>

                <div class="form-group">
                    <label>Correo <span class="req">*</span></label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com">
                </div>

                <div class="form-group">
                    <label>Password <span class="req">*</span></label>
                    <input type="password" id="password" required minlength="6" placeholder="Minimo 6 caracteres">
                </div>

                <div class="form-group">
                    <label>Rol <span class="req">*</span></label>
                    <select id="rol" required>
                        <option value="admin">Admin</option>
                        <option value="visualizador">Visualizador</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveUsuario">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/supabase.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/app.js"></script>
    <script>
        let allUsuarios = [];

        function toggleTheme() {
            var body = document.body;
            var icon = document.getElementById('themeIcon');
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                icon.className = 'fas fa-moon';
                localStorage.setItem('inv_theme', 'light');
            } else {
                body.classList.add('dark');
                icon.className = 'fas fa-sun';
                localStorage.setItem('inv_theme', 'dark');
            }
        }

        (function () {
            var saved = localStorage.getItem('inv_theme');
            if (saved === 'dark') {
                document.body.classList.add('dark');
                document.getElementById('themeIcon').className = 'fas fa-sun';
            }
        })();

        function handleLogout() {
            if (typeof invLogout === 'function') invLogout();
            window.location.href = '../login.html';
        }

        async function loadUsuarios() {
            try {
                if (typeof requireInvAuth === 'function') await requireInvAuth();

                var user = typeof getInvUser === 'function' ? getInvUser() : null;
                var nameEl = document.getElementById('userName');
                if (user && nameEl) nameEl.textContent = user.email || user.name || 'Usuario';

                var result = [];
                if (typeof InvDB !== 'undefined' && InvDB.getUsuarios) {
                    result = await InvDB.getUsuarios();
                }

                allUsuarios = result || [];
                renderUsuarios();
            } catch (err) {
                console.error('Error loading usuarios:', err);
                document.getElementById('usuariosTableBody').innerHTML =
                    '<tr><td colspan="5" class="empty-state"><i class="fas fa-exclamation-triangle"></i> Error al cargar usuarios</td></tr>';
            }
        }

        function renderUsuarios() {
            var tbody = document.getElementById('usuariosTableBody');
            var currentUser = typeof getInvUser === 'function' ? getInvUser() : null;

            if (allUsuarios.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state"><i class="fas fa-inbox"></i> No se encontraron usuarios</td></tr>';
            } else {
                tbody.innerHTML = allUsuarios.map(function (u) {
                    var rolBadge = u.rol === 'admin' ? 'badge-success' : 'badge-info';
                    var fecha = u.created_at ? new Date(u.created_at).toLocaleDateString('es-MX') : '-';
                    var canDelete = currentUser && currentUser.email !== u.correo;
                    return '<tr>' +
                        '<td><strong>' + (u.nombre || 'N/A') + '</strong></td>' +
                        '<td>' + (u.correo || '-') + '</td>' +
                        '<td><span class="badge ' + rolBadge + '">' + (u.rol || 'N/A') + '</span></td>' +
                        '<td>' + fecha + '</td>' +
                        '<td>' +
                            '<div class="action-btns">' +
                                (canDelete ? '<button class="btn-del" title="Eliminar" onclick="deleteUsuario(\'' + u.id + '\')"><i class="fas fa-trash"></i></button>' : '') +
                            '</div>' +
                        '</td>' +
                        '</tr>';
                }).join('');
            }
        }

        function openModal() {
            document.getElementById('usuarioForm').reset();
            document.getElementById('usuarioModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('usuarioModal').classList.remove('show');
        }

        async function handleUsuarioSubmit(e) {
            e.preventDefault();
            var btn = document.getElementById('btnSaveUsuario');
            btn.disabled = true;

            var nombre = document.getElementById('nombre').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var rol = document.getElementById('rol').value;

            try {
                if (invClient) {
                    var authResult = await invClient.auth.signUp({
                        email: email,
                        password: password
                    });

                    if (authResult.error) {
                        alert('Error al crear usuario auth: ' + authResult.error.message);
                        btn.disabled = false;
                        return;
                    }

                    if (InvDB && typeof invClient !== 'undefined') {
                        await invClient.from('inv_usuarios').insert({
                            nombre: nombre,
                            correo: email,
                            rol: rol,
                            uid: authResult.data && authResult.data.user ? authResult.data.user.id : null
                        });
                    }
                } else {
                    alert('Modo demo: usuario no creado en servidor.');
                }

                closeModal();
                await loadUsuarios();
            } catch (err) {
                console.error('Error saving usuario:', err);
                alert('Error al guardar: ' + (err.message || 'Error desconocido'));
            } finally {
                btn.disabled = false;
            }
        }

        async function deleteUsuario(id) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            try {
                if (typeof InvDB !== 'undefined' && InvDB.deleteUsuario) {
                    await InvDB.deleteUsuario(id);
                }
                await loadUsuarios();
            } catch (err) {
                console.error('Error deleting usuario:', err);
                alert('Error al eliminar: ' + (err.message || 'Error desconocido'));
            }
        }

        document.addEventListener('DOMContentLoaded', loadUsuarios);
    </script>
</body>
</html>
