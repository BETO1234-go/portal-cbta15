<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendientes - Inventario Escolar</title>
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{--primary:#1a73e8;--primary-hover:#1557b0;--bg:#f0f2f5;--surface:#fff;--text:#1f2937;--text-muted:#6b7280;--border:#e5e7eb;--sidebar-bg:#fff;--sidebar-width:260px;--danger:#dc2626;--success:#16a34a;--warning:#f59e0b;--info:#0ea5e9}
        body.dark{--primary:#4dabf7;--primary-hover:#339af0;--bg:#1a1a2e;--surface:#16213e;--text:#e4e6eb;--text-muted:#adb5bd;--border:#2d3748;--sidebar-bg:#0f1629;--danger:#fc5c65;--success:#26de81;--warning:#fed330;--info:#4bcffa}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;transition:background .3s,color .3s}
        .sidebar{width:var(--sidebar-width);background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;transition:background .3s,border-color .3s}
        .sidebar-header{padding:24px 20px;border-bottom:1px solid var(--border)}
        .sidebar-header h2{font-size:1.15rem;color:var(--primary);display:flex;align-items:center;gap:10px}
        .sidebar-header h2 i{font-size:1.3rem}
        .sidebar-header p{font-size:.8rem;color:var(--text-muted);margin-top:4px}
        .sidebar-nav{flex:1;overflow-y:auto;padding:12px 0}
        .sidebar-nav a{display:flex;align-items:center;gap:12px;padding:12px 20px;color:var(--text-muted);text-decoration:none;font-size:.95rem;transition:all .2s;border-left:3px solid transparent}
        .sidebar-nav a:hover{background:var(--bg);color:var(--text)}
        .sidebar-nav a.active{background:rgba(26,115,232,.08);color:var(--primary);border-left-color:var(--primary);font-weight:600}
        body.dark .sidebar-nav a.active{background:rgba(77,171,247,.1)}
        .sidebar-nav a i{width:20px;text-align:center;font-size:1rem}
        .sidebar-footer{padding:16px 20px;border-top:1px solid var(--border)}
        .sidebar-footer .user-info{font-size:.85rem;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .sidebar-footer .user-info i{color:var(--primary)}
        .sidebar-footer .footer-actions{display:flex;align-items:center;gap:8px}
        .sidebar-footer button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s}
        .sidebar-footer button:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
        .sidebar-footer .btn-logout:hover{background:var(--danger);border-color:var(--danger)}
        .main-content{margin-left:var(--sidebar-width);flex:1;padding:32px;min-height:100vh}
        .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px}
        .page-header h1{font-size:1.8rem;color:var(--text)}
        .page-header h1 i{color:var(--primary);margin-right:8px}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;transition:background .3s,border-color .3s}
        .table-container{overflow-x:auto}
        table{width:100%;border-collapse:collapse}
        table th,table td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:.88rem}
        table th{font-weight:600;color:var(--text-muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;background:var(--bg)}
        table tr:hover td{background:rgba(26,115,232,.03)}
        body.dark table tr:hover td{background:rgba(77,171,247,.05)}
        .badge{padding:4px 10px;border-radius:20px;font-size:.76rem;font-weight:600;display:inline-block;white-space:nowrap}
        .badge-success{background:rgba(22,163,74,.12);color:#16a34a}
        .badge-info{background:rgba(14,165,233,.12);color:#0ea5e9}
        .badge-warning{background:rgba(245,158,11,.12);color:#d97706}
        .badge-danger{background:rgba(220,38,38,.12);color:#dc2626}
        .badge-orange{background:rgba(249,115,22,.12);color:#ea580c}
        .badge-red{background:rgba(220,38,38,.12);color:#dc2626}
        .badge-yellow{background:rgba(245,158,11,.12);color:#d97706}
        .badge-bg-orange{background:rgba(249,115,22,.12);color:#ea580c}
        .btn{padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.9rem;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:all .2s;text-decoration:none}
        .btn:hover{background:var(--bg)}
        .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
        .btn-primary:hover{background:var(--primary-hover)}
        .btn-sm{padding:6px 12px;font-size:.82rem}
        .btn-success{background:var(--success);color:#fff;border-color:var(--success)}
        .pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;flex-wrap:wrap}
        .pagination button{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.88rem;transition:all .2s}
        .pagination button:hover{background:var(--bg)}
        .pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
        .pagination button:disabled{opacity:.4;cursor:not-allowed}
        .empty-state{text-align:center;padding:48px 20px;color:var(--text-muted)}
        .empty-state i{font-size:3rem;margin-bottom:12px;display:block;opacity:.4}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
        .modal-overlay.show{display:flex}
        .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:32px;position:relative;transition:background .3s,border-color .3s}
        .modal h2{font-size:1.3rem;color:var(--text);margin-bottom:24px;display:flex;align-items:center;gap:10px}
        .modal h2 i{color:var(--primary)}
        .modal-close{position:absolute;top:20px;right:20px;background:none;border:none;font-size:1.3rem;color:var(--text-muted);cursor:pointer;transition:color .2s}
        .modal-close:hover{color:var(--danger)}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:.85rem;color:var(--text)}
        .form-group label .req{color:var(--danger)}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.95rem;outline:none;transition:border .3s}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary)}
        .form-group textarea{resize:vertical;min-height:80px}
        .form-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
        @media(max-width:768px){.sidebar{display:none}.main-content{margin-left:0;padding:20px}.page-header{flex-direction:column;align-items:flex-start}}
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-boxes-stacked"></i> Inventario</h2>
            <p>CBTA 15</p>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="bienes.html"><i class="fas fa-box-open"></i> Bienes</a>
            <a href="personal.html"><i class="fas fa-users"></i> Personal</a>
            <a href="areas.html"><i class="fas fa-building"></i> Areas</a>
            <a href="asignaciones.html"><i class="fas fa-link"></i> Asignaciones</a>
            <a href="historial.html"><i class="fas fa-clock-rotate-left"></i> Historial</a>
            <a href="reportes.html"><i class="fas fa-file-lines"></i> Reportes</a>
            <a href="pendientes.html" class="active"><i class="fas fa-hourglass-half"></i> Pendientes</a>
            <a href="usuarios.html"><i class="fas fa-user-shield"></i> Usuarios</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info" id="userInfo">
                <i class="fas fa-user-circle"></i>
                <span id="userName">Cargando...</span>
            </div>
            <div class="footer-actions">
                <button onclick="toggleTheme()" id="themeBtn" title="Cambiar tema">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <button class="btn-logout" onclick="handleLogout()" title="Cerrar sesion">
                    <i class="fas fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-hourglass-half"></i> Bienes Pendientes</h1>
        </div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>No. Inventario</th>
                            <th>Bien</th>
                            <th>Marca</th>
                            <th>Estatus</th>
                            <th>Area</th>
                            <th>Personal</th>
                            <th>Prioridad</th>
                            <th>Accion</th>
                        </tr>
                    </thead>
                    <tbody id="pendientesTableBody">
                        <tr>
                            <td colspan="8" class="empty-state">
                                <i class="fas fa-hourglass-half"></i>
                                Cargando bienes pendientes...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="paginationControls"></div>
        </div>
    </main>

    <div class="modal-overlay" id="resolverModal">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2><i class="fas fa-wrench"></i> Resolver Bien</h2>
            <form id="resolverForm" onsubmit="handleResolverSubmit(event)">
                <input type="hidden" id="bienId">

                <div class="form-group">
                    <label>No. Inventario</label>
                    <input type="text" id="noInventario" readonly>
                </div>

                <div class="form-group">
                    <label>Nombre del Bien</label>
                    <input type="text" id="nombreBien" readonly>
                </div>

                <div class="form-group">
                    <label>Accion a realizar <span class="req">*</span></label>
                    <select id="accionResolver" required onchange="handleAccionChange()">
                        <option value="">-- Seleccionar accion --</option>
                        <option value="asignar">Asignar &rarr; Asignado</option>
                        <option value="mantenimiento">Mantenimiento &rarr; En mantenimiento</option>
                        <option value="reparar">Reparar &rarr; En revision</option>
                        <option value="descartar">Descartar &rarr; Baja</option>
                    </select>
                </div>

                <div class="form-group" id="areaGroup">
                    <label>Nueva Area</label>
                    <select id="nuevaArea">
                        <option value="">-- Seleccionar area --</option>
                    </select>
                </div>

                <div class="form-group" id="personalGroup">
                    <label>Nuevo Personal</label>
                    <select id="nuevoPersonal">
                        <option value="">-- Seleccionar personal --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Observaciones</label>
                    <textarea id="observaciones" placeholder="Detalles de la resolucion..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnResolver">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/app.js"></script>
    <script>
        let allPendientes = [];

        function toggleTheme() {
            var body = document.body;
            var icon = document.getElementById('themeIcon');
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                icon.className = 'fas fa-moon';
                localStorage.setItem('inv_theme', 'light');
            } else {
                body.classList.add('dark');
                icon.className = 'fas fa-sun';
                localStorage.setItem('inv_theme', 'dark');
            }
        }

        (function () {
            var saved = localStorage.getItem('inv_theme');
            if (saved === 'dark') {
                document.body.classList.add('dark');
                document.getElementById('themeIcon').className = 'fas fa-sun';
            }
        })();

        function handleLogout() {
            if (typeof invLogout === 'function') invLogout();
            window.location.href = '../login.html';
        }

        function getEstatusBadge(estatus) {
            var map = {
                'Asignado': 'badge-success',
                'Disponible': 'badge-info',
                'Pendiente': 'badge-warning',
                'Baja': 'badge-danger',
                'En mantenimiento': 'badge-orange',
                'En revision': 'badge-orange',
                'Danado': 'badge-danger'
            };
            return '<span class="badge ' + (map[estatus] || 'badge-info') + '">' + (estatus || 'N/A') + '</span>';
        }

        function getPrioridad(estatus) {
            if (estatus === 'Danado' || estatus === 'Baja') return { label: 'Alta', cls: 'badge badge-danger' };
            if (estatus === 'En revision' || estatus === 'En mantenimiento') return { label: 'Media', cls: 'badge badge-orange' };
            return { label: 'Baja', cls: 'badge badge-warning' };
        }

        async function loadPendientes() {
            try {
                if (typeof requireInvAuth === 'function') await requireInvAuth();

                var user = typeof getInvUser === 'function' ? getInvUser() : null;
                var nameEl = document.getElementById('userName');
                if (user && nameEl) nameEl.textContent = user.email || user.name || 'Usuario';

                var result = { data: [], total: 0 };
                if (typeof InvDB !== 'undefined' && InvDB.getPendientes) {
                    result = await InvDB.getPendientes(1, 100);
                }

                allPendientes = result.data || [];
                renderPendientes();
            } catch (err) {
                console.error('Error loading pendientes:', err);
                document.getElementById('pendientesTableBody').innerHTML =
                    '<tr><td colspan="8" class="empty-state"><i class="fas fa-exclamation-triangle"></i> Error al cargar pendientes</td></tr>';
            }
        }

        function renderPendientes() {
            var tbody = document.getElementById('pendientesTableBody');

            if (allPendientes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-check-circle"></i> No hay bienes pendientes</td></tr>';
            } else {
                tbody.innerHTML = allPendientes.map(function (b) {
                    var areaNombre = b.inv_areas ? b.inv_areas.nombre_area : (b.id_area || '-');
                    var personalNombre = '-';
                    if (b.inv_personal) {
                        personalNombre = [b.inv_personal.nombre, b.inv_personal.apellido_paterno].filter(Boolean).join(' ');
                    }
                    var pri = getPrioridad(b.estatus);
                    return '<tr>' +
                        '<td><strong>' + (b.no_inventario || 'N/A') + '</strong></td>' +
                        '<td>' + (b.nombre_bien || 'N/A') + '</td>' +
                        '<td>' + (b.marca || '-') + '</td>' +
                        '<td>' + getEstatusBadge(b.estatus) + '</td>' +
                        '<td>' + areaNombre + '</td>' +
                        '<td>' + personalNombre + '</td>' +
                        '<td><span class="' + pri.cls + '">' + pri.label + '</span></td>' +
                        '<td><button class="btn btn-sm btn-success" onclick="openResolver(\'' + b.id + '\', \'' + (b.no_inventario || '').replace(/'/g, "\\'") + '\', \'' + (b.nombre_bien || '').replace(/'/g, "\\'") + '\')"><i class="fas fa-wrench"></i> Resolver</button></td>' +
                        '</tr>';
                }).join('');
            }

            document.getElementById('paginationControls').innerHTML = '';
        }

        async function loadSelects() {
            try {
                if (typeof InvDB !== 'undefined') {
                    if (InvDB.getAreas) {
                        var result = await InvDB.getAreas();
                        var areas = result.data || result;
                        var areaSelect = document.getElementById('nuevaArea');
                        areas.forEach(function (a) {
                            var opt = document.createElement('option');
                            opt.value = a.id;
                            opt.textContent = a.nombre_area || a.nombre || a.id;
                            areaSelect.appendChild(opt);
                        });
                    }

                    if (InvDB.getPersonal) {
                        var pResult = await InvDB.getPersonal();
                        var personal = pResult.data || pResult;
                        var perSelect = document.getElementById('nuevoPersonal');
                        personal.forEach(function (p) {
                            var opt = document.createElement('option');
                            opt.value = p.id;
                            opt.textContent = p.nombre_completo || [p.nombre, p.apellido_paterno, p.apellido_materno].filter(Boolean).join(' ') || p.id;
                            perSelect.appendChild(opt);
                        });
                    }
                }
            } catch (err) {
                console.error('Error loading selects:', err);
            }
        }

        function openResolver(bienId, noInventario, nombreBien) {
            document.getElementById('resolverForm').reset();
            document.getElementById('bienId').value = bienId;
            document.getElementById('noInventario').value = noInventario;
            document.getElementById('nombreBien').value = nombreBien;
            document.getElementById('resolverModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('resolverModal').classList.remove('show');
        }

        function handleAccionChange() {
            var accion = document.getElementById('accionResolver').value;
            var areaGroup = document.getElementById('areaGroup');
            var personalGroup = document.getElementById('personalGroup');

            if (accion === 'asignar') {
                areaGroup.style.display = 'block';
                personalGroup.style.display = 'block';
            } else if (accion === 'mantenimiento' ||accion === 'reparar') {
                areaGroup.style.display = 'block';
                personalGroup.style.display = 'none';
            } else {
                areaGroup.style.display = 'none';
                personalGroup.style.display = 'none';
            }
        }

        async function handleResolverSubmit(e) {
            e.preventDefault();
            var btn = document.getElementById('btnResolver');
            btn.disabled = true;

            var bienId = document.getElementById('bienId').value;
            var accion = document.getElementById('accionResolver').value;
            var area = document.getElementById('nuevaArea').value || null;
            var personal = document.getElementById('nuevoPersonal').value || null;
            var obs = document.getElementById('observaciones').value.trim();

            var nuevoEstatus = '';
            var tipoMovimiento = '';
            if (accion === 'asignar') {
                nuevoEstatus = 'Asignado';
                tipoMovimiento = 'Asignacion';
            } else if (accion === 'mantenimiento') {
                nuevoEstatus = 'En mantenimiento';
                tipoMovimiento = 'Mantenimiento';
            } else if (accion === 'reparar') {
                nuevoEstatus = 'En revision';
                tipoMovimiento = 'Reparacion';
            } else if (accion === 'descartar') {
                nuevoEstatus = 'Baja';
                tipoMovimiento = 'Baja';
            }

            try {
                if (typeof InvDB !== 'undefined') {
                    var updates = { estatus: nuevoEstatus };
                    if (accion === 'asignar' && area) updates.id_area = area;
                    if (accion === 'asignar' && personal) updates.id_personal = personal;
                    if ((accion === 'mantenimiento' || accion === 'reparar') && area) updates.id_area = area;

                    if (InvDB.updateBien) {
                        await InvDB.updateBien(bienId, updates);
                    }

                    if (InvDB.createHistorial) {
                        await InvDB.createHistorial({
                            id_bien: bienId,
                            id_area_nueva: area || null,
                            id_personal_nuevo: personal || null,
                            tipo_movimiento: tipoMovimiento,
                            observaciones: obs
                        });
                    }
                }
                closeModal();
                await loadPendientes();
            } catch (err) {
                console.error('Error resolving bien:', err);
                alert('Error al resolver: ' + (err.message || 'Error desconocido'));
            } finally {
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', async function () {
            await loadSelects();
            await loadPendientes();
        });
    </script>
</body>
</html>
