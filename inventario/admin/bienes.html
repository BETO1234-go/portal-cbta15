<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienes - Inventario Escolar</title>
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --bg: #f0f2f5;
            --surface: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --sidebar-bg: #ffffff;
            --sidebar-width: 260px;
            --danger: #dc2626;
            --success: #16a34a;
            --warning: #f59e0b;
            --info: #0ea5e9;
        }

        body.dark {
            --primary: #4dabf7;
            --primary-hover: #339af0;
            --bg: #1a1a2e;
            --surface: #16213e;
            --text: #e4e6eb;
            --text-muted: #adb5bd;
            --border: #2d3748;
            --sidebar-bg: #0f1629;
            --danger: #fc5c65;
            --success: #26de81;
            --warning: #fed330;
            --info: #4bcffa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 50;
            transition: background 0.3s, border-color 0.3s;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h2 {
            font-size: 1.15rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header h2 i { font-size: 1.3rem; }

        .sidebar-header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .sidebar-nav a:hover {
            background: var(--bg);
            color: var(--text);
        }

        .sidebar-nav a.active {
            background: rgba(26, 115, 232, 0.08);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 600;
        }

        body.dark .sidebar-nav a.active {
            background: rgba(77, 171, 247, 0.1);
        }

        .sidebar-nav a i {
            width: 20px;
            text-align: center;
            font-size: 1rem;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
        }

        .sidebar-footer .user-info {
            font-size: 0.85rem;
            color: var(--text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-footer .user-info i { color: var(--primary); }

        .sidebar-footer .footer-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-footer button {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .sidebar-footer button:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .sidebar-footer .btn-logout:hover {
            background: var(--danger);
            border-color: var(--danger);
        }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 32px;
            min-height: 100vh;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-header h1 {
            font-size: 1.8rem;
            color: var(--text);
        }

        .page-header h1 i {
            color: var(--primary);
            margin-right: 8px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--bg);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            color: var(--danger);
            border-color: var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: #fff;
        }

        .filters-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 220px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .filter-select {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            min-width: 170px;
            cursor: pointer;
        }

        .filter-select:focus {
            border-color: var(--primary);
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            transition: background 0.3s, border-color 0.3s;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th, table td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.88rem;
        }

        table th {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: var(--bg);
        }

        table tr:hover td {
            background: rgba(26, 115, 232, 0.03);
        }

        body.dark table tr:hover td {
            background: rgba(77, 171, 247, 0.05);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.76rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }

        .badge-success { background: rgba(22,163,74,0.12); color: #16a34a; }
        .badge-info { background: rgba(14,165,233,0.12); color: #0ea5e9; }
        .badge-warning { background: rgba(245,158,11,0.12); color: #d97706; }
        .badge-danger { background: rgba(220,38,38,0.12); color: #dc2626; }
        .badge-orange { background: rgba(249,115,22,0.12); color: #ea580c; }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .action-btns button {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .action-btns button:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .action-btns button.btn-qr:hover {
            background: var(--info);
            border-color: var(--info);
        }

        .action-btns button.btn-del:hover {
            background: var(--danger);
            border-color: var(--danger);
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 0.88rem;
            transition: all 0.2s;
        }

        .pagination button:hover {
            background: var(--bg);
        }

        .pagination button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 12px;
            display: block;
            opacity: 0.4;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 620px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
            position: relative;
            transition: background 0.3s, border-color 0.3s;
        }

        .modal h2 {
            font-size: 1.3rem;
            color: var(--text);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal h2 i {
            color: var(--primary);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.3rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: var(--danger);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
        }

        .form-group label .req {
            color: var(--danger);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
        }

        .form-group input[readonly] {
            opacity: 0.7;
            cursor: default;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .qr-modal-content {
            text-align: center;
            padding: 20px 0;
        }

        .qr-modal-content canvas {
            max-width: 250px;
            margin: 0 auto 16px;
            display: block;
            border: 4px solid var(--surface);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        .qr-modal-content p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 20px; }
            .form-row { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-boxes-stacked"></i> Inventario</h2>
            <p>CBTA 15</p>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="bienes.html" class="active"><i class="fas fa-box-open"></i> Bienes</a>
            <a href="personal.html"><i class="fas fa-users"></i> Personal</a>
            <a href="areas.html"><i class="fas fa-building"></i> Areas</a>
            <a href="asignaciones.html"><i class="fas fa-link"></i> Asignaciones</a>
            <a href="historial.html"><i class="fas fa-clock-rotate-left"></i> Historial</a>
            <a href="reportes.html"><i class="fas fa-file-lines"></i> Reportes</a>
            <a href="pendientes.html"><i class="fas fa-hourglass-half"></i> Pendientes</a>
            <a href="usuarios.html"><i class="fas fa-user-shield"></i> Usuarios</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info" id="userInfo">
                <i class="fas fa-user-circle"></i>
                <span id="userName">Cargando...</span>
            </div>
            <div class="footer-actions">
                <button onclick="toggleTheme()" id="themeBtn" title="Cambiar tema">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <button class="btn-logout" onclick="handleLogout()" title="Cerrar sesion">
                    <i class="fas fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-box-open"></i> Bienes</h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="openModal()">
                    <i class="fas fa-plus"></i> Nuevo Bien
                </button>
                <button class="btn" onclick="importCSV()">
                    <i class="fas fa-file-csv"></i> Importar CSV
                </button>
                <a href="papelera.html" class="btn btn-danger">
                    <i class="fas fa-trash-can"></i> Papelera
                </a>
            </div>
        </div>

        <div class="filters-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar por nombre, marca, serie, No. inventario..." oninput="debounceSearch()">
            </div>
            <select class="filter-select" id="filterEstatus" onchange="loadBienes()">
                <option value="">Todos</option>
                <option value="Disponible">Disponible</option>
                <option value="Asignado">Asignado</option>
                <option value="Pendiente">Pendiente</option>
                <option value="Baja">Baja</option>
                <option value="En revision">En revision</option>
                <option value="En mantenimiento">En mantenimiento</option>
                <option value="Danado">Danado</option>
            </select>
        </div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>No. Inventario</th>
                            <th>Nombre</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Serie</th>
                            <th>Area</th>
                            <th>Personal</th>
                            <th>Estatus</th>
                            <th>Accion</th>
                        </tr>
                    </thead>
                    <tbody id="bienesTableBody">
                        <tr>
                            <td colspan="9" class="empty-state">
                                <i class="fas fa-box-open"></i>
                                Cargando bienes...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="paginationControls"></div>
        </div>
    </main>

    <div class="modal-overlay" id="bienModal">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle"><i class="fas fa-plus-circle"></i> Nuevo Bien</h2>
            <form id="bienForm" onsubmit="handleBienSubmit(event)">
                <input type="hidden" id="bienId">

                <div class="form-row">
                    <div class="form-group full">
                        <label>No. Inventario</label>
                        <input type="text" id="noInventario" readonly placeholder="Auto-generado">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre del bien <span class="req">*</span></label>
                        <input type="text" id="nombreBien" required placeholder="Ej. Computadora de escritorio">
                    </div>
                    <div class="form-group">
                        <label>Marca</label>
                        <input type="text" id="marca" placeholder="Ej. HP, Dell, Lenovo">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Modelo</label>
                        <input type="text" id="modelo" placeholder="Ej. OptiPlex 7090">
                    </div>
                    <div class="form-group">
                        <label>No. Serie</label>
                        <input type="text" id="serie" placeholder="Numero de serie">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Adquisicion</label>
                        <input type="text" id="adq" placeholder="Ej. Donacion, Compra, Transferencia">
                    </div>
                    <div class="form-group">
                        <label>Valor ($)</label>
                        <input type="number" id="valor" step="0.01" min="0" placeholder="0.00">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Area</label>
                        <select id="idArea">
                            <option value="">-- Seleccionar area --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Personal</label>
                        <select id="idPersonal">
                            <option value="">-- Seleccionar personal --</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>ID SEP</label>
                        <input type="text" id="idSep" placeholder="Clave SEP">
                    </div>
                    <div class="form-group">
                        <label>Estatus</label>
                        <select id="estatus">
                            <option value="Disponible">Disponible</option>
                            <option value="Asignado">Asignado</option>
                            <option value="Pendiente">Pendiente</option>
                            <option value="En revision">En revision</option>
                            <option value="En mantenimiento">En mantenimiento</option>
                            <option value="Baja">Baja</option>
                            <option value="Danado">Danado</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveBien">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="qrModal">
        <div class="modal" style="max-width: 400px;">
            <button class="modal-close" onclick="closeQRModal()">&times;</button>
            <h2><i class="fas fa-qrcode"></i> Codigo QR</h2>
            <div class="qr-modal-content">
                <canvas id="qrCanvas"></canvas>
                <p id="qrLabel"></p>
            </div>
            <div class="form-actions">
                <button class="btn" onclick="closeQRModal()">Cerrar</button>
                <button class="btn btn-primary" onclick="printQR()">
                    <i class="fas fa-print"></i> Imprimir
                </button>
            </div>
        </div>
    </div>

    <script src="../js/supabase.js"></script>
    <script src="../js/db.js"></script>
    <script src="../../js/pagination.js"></script>
    <script src="../js/app.js"></script>
    <script>
        let currentPage = 1;
        const perPage = 15;
        let allBienes = [];
        let searchTimeout = null;

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                icon.className = 'fas fa-moon';
                localStorage.setItem('inv_theme', 'light');
            } else {
                body.classList.add('dark');
                icon.className = 'fas fa-sun';
                localStorage.setItem('inv_theme', 'dark');
            }
        }

        (function () {
            const saved = localStorage.getItem('inv_theme');
            if (saved === 'dark') {
                document.body.classList.add('dark');
                document.getElementById('themeIcon').className = 'fas fa-sun';
            }
        })();

        function handleLogout() {
            if (typeof invLogout === 'function') invLogout();
            window.location.href = '../login.html';
        }

        function getEstatusBadge(estatus) {
            const map = {
                'Asignado': 'badge-success',
                'Disponible': 'badge-info',
                'Pendiente': 'badge-warning',
                'Baja': 'badge-danger',
                'En mantenimiento': 'badge-orange',
                'En revision': 'badge-orange',
                'Danado': 'badge-danger'
            };
            return `<span class="badge ${map[estatus] || 'badge-info'}">${estatus || 'N/A'}</span>`;
        }

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentPage = 1;
                loadBienes();
            }, 300);
        }

        async function loadBienes() {
            try {
                if (typeof requireInvAuth === 'function') await requireInvAuth();

                const user = typeof getInvUser === 'function' ? getInvUser() : null;
                const nameEl = document.getElementById('userName');
                if (user && nameEl) nameEl.textContent = user.email || user.name || 'Usuario';

                const search = document.getElementById('searchInput').value.trim().toLowerCase();
                const estatus = document.getElementById('filterEstatus').value;

                let data = [];
                if (typeof InvDB !== 'undefined' && InvDB.getBienes) {
                    data = await InvDB.getBienes({ estatus: estatus || undefined });
                }

                if (search) {
                    data = data.filter(b =>
                        (b.nombre_bien || '').toLowerCase().includes(search) ||
                        (b.marca || '').toLowerCase().includes(search) ||
                        (b.modelo || '').toLowerCase().includes(search) ||
                        (b.serie || '').toLowerCase().includes(search) ||
                        (b.no_inventario || '').toLowerCase().includes(search)
                    );
                }

                allBienes = data;
                renderBienes();
            } catch (err) {
                console.error('Error loading bienes:', err);
                document.getElementById('bienesTableBody').innerHTML =
                    '<tr><td colspan="9" class="empty-state"><i class="fas fa-exclamation-triangle"></i> Error al cargar bienes</td></tr>';
            }
        }

        function renderBienes() {
            const tbody = document.getElementById('bienesTableBody');
            const total = allBienes.length;
            const totalPages = Math.max(1, Math.ceil(total / perPage));
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * perPage;
            const pageData = allBienes.slice(start, start + perPage);

            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="empty-state"><i class="fas fa-inbox"></i> No se encontraron bienes</td></tr>';
            } else {
                tbody.innerHTML = pageData.map(b => `
                    <tr>
                        <td><strong>${b.no_inventario || 'N/A'}</strong></td>
                        <td>${b.nombre_bien || 'N/A'}</td>
                        <td>${b.marca || '-'}</td>
                        <td>${b.modelo || '-'}</td>
                        <td>${b.serie || '-'}</td>
                        <td>${b.area_nombre || b.id_area || '-'}</td>
                        <td>${b.personal_nombre || b.id_personal || '-'}</td>
                        <td>${getEstatusBadge(b.estatus)}</td>
                        <td>
                            <div class="action-btns">
                                <button title="Editar" onclick="editBien('${b.id}')"><i class="fas fa-pen"></i></button>
                                <button class="btn-qr" title="Codigo QR" onclick="showQR('${b.id}', '${(b.no_inventario || '').replace(/'/g, "\\'")}')"><i class="fas fa-qrcode"></i></button>
                                <button class="btn-del" title="Eliminar" onclick="deleteBien('${b.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            }

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('paginationControls');
            if (typeof renderPaginationControls === 'function') {
                renderPaginationControls(container, currentPage, totalPages, (page) => {
                    currentPage = page;
                    renderBienes();
                });
                return;
            }

            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html = '';
            html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>`;

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<button disabled>...</button>`;
                }
            }

            html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>`;
            container.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            renderBienes();
        }

        async function loadSelects() {
            try {
                if (typeof InvDB !== 'undefined') {
                    if (InvDB.getAreas) {
                        const areas = await InvDB.getAreas();
                        const areaSelect = document.getElementById('idArea');
                        areas.forEach(a => {
                            const opt = document.createElement('option');
                            opt.value = a.id;
                            opt.textContent = a.nombre_area || a.nombre || a.id;
                            areaSelect.appendChild(opt);
                        });
                    }

                    if (InvDB.getPersonal) {
                        const personal = await InvDB.getPersonal();
                        const perSelect = document.getElementById('idPersonal');
                        personal.forEach(p => {
                            const opt = document.createElement('option');
                            opt.value = p.id;
                            opt.textContent = p.nombre_completo || p.nombre || p.id;
                            perSelect.appendChild(opt);
                        });
                    }
                }
            } catch (err) {
                console.error('Error loading selects:', err);
            }
        }

        function openModal(bien) {
            const modal = document.getElementById('bienModal');
            const form = document.getElementById('bienForm');
            const title = document.getElementById('modalTitle');
            form.reset();
            document.getElementById('bienId').value = '';
            document.getElementById('noInventario').value = '';

            if (bien) {
                title.innerHTML = '<i class="fas fa-edit"></i> Editar Bien';
                document.getElementById('bienId').value = bien.id || '';
                document.getElementById('noInventario').value = bien.no_inventario || '';
                document.getElementById('nombreBien').value = bien.nombre_bien || '';
                document.getElementById('marca').value = bien.marca || '';
                document.getElementById('modelo').value = bien.modelo || '';
                document.getElementById('serie').value = bien.serie || '';
                document.getElementById('adq').value = bien.adq || bien.adquisicion || '';
                document.getElementById('valor').value = bien.valor || '';
                document.getElementById('idArea').value = bien.id_area || '';
                document.getElementById('idPersonal').value = bien.id_personal || '';
                document.getElementById('idSep').value = bien.id_sep || '';
                document.getElementById('estatus').value = bien.estatus || 'Disponible';
            } else {
                title.innerHTML = '<i class="fas fa-plus-circle"></i> Nuevo Bien';
            }

            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('bienModal').classList.remove('show');
        }

        async function handleBienSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('bienId').value;
            const btn = document.getElementById('btnSaveBien');
            btn.disabled = true;

            const payload = {
                nombre_bien: document.getElementById('nombreBien').value.trim(),
                marca: document.getElementById('marca').value.trim(),
                modelo: document.getElementById('modelo').value.trim(),
                serie: document.getElementById('serie').value.trim(),
                adq: document.getElementById('adq').value.trim(),
                valor: parseFloat(document.getElementById('valor').value) || 0,
                id_area: document.getElementById('idArea').value || null,
                id_personal: document.getElementById('idPersonal').value || null,
                id_sep: document.getElementById('idSep').value.trim(),
                estatus: document.getElementById('estatus').value
            };

            try {
                if (typeof InvDB !== 'undefined') {
                    if (id && InvDB.updateBien) {
                        await InvDB.updateBien(id, payload);
                    } else if (InvDB.createBien) {
                        await InvDB.createBien(payload);
                    }
                }
                closeModal();
                await loadBienes();
            } catch (err) {
                console.error('Error saving bien:', err);
                alert('Error al guardar: ' + (err.message || 'Error desconocido'));
            } finally {
                btn.disabled = false;
            }
        }

        async function editBien(id) {
            try {
                let bien = null;
                if (typeof InvDB !== 'undefined' && InvDB.getBien) {
                    bien = await InvDB.getBien(id);
                } else if (allBienes.length) {
                    bien = allBienes.find(b => b.id === id);
                }
                if (bien) openModal(bien);
            } catch (err) {
                console.error('Error fetching bien:', err);
            }
        }

        async function deleteBien(id) {
            if (!confirm('Are you sure you want to delete this item?')) return;
            try {
                if (typeof InvDB !== 'undefined' && InvDB.deleteBien) {
                    await InvDB.deleteBien(id);
                }
                await loadBienes();
            } catch (err) {
                console.error('Error deleting bien:', err);
                alert('Error al eliminar: ' + (err.message || 'Error desconocido'));
            }
        }

        function showQR(id, label) {
            const modal = document.getElementById('qrModal');
            const canvas = document.getElementById('qrCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 250;
            canvas.height = 250;
            ctx.clearRect(0, 0, 250, 250);

            if (typeof QRCode !== 'undefined') {
                QRCode.toCanvas(canvas, id, { width: 250 }, (err) => {
                    if (err) console.error(err);
                });
            } else {
                ctx.fillStyle = '#f0f0f0';
                ctx.fillRect(0, 0, 250, 250);
                ctx.fillStyle = '#333';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('QR: ' + (label || id), 125, 125);
                ctx.fillText('(QR library not loaded)', 125, 145);
            }

            document.getElementById('qrLabel').textContent = label || id;
            modal.classList.add('show');
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.remove('show');
        }

        function printQR() {
            const canvas = document.getElementById('qrCanvas');
            const label = document.getElementById('qrLabel').textContent;
            const win = window.open('', '_blank');
            win.document.write('<html><head><title>QR - ' + label + '</title></head><body style="text-align:center;padding:40px;">');
            win.document.write('<h3>' + label + '</h3>');
            win.document.write('<img src="' + canvas.toDataURL() + '" style="max-width:200px;">');
            win.document.write('</body></html>');
            win.document.close();
            win.print();
        }

        function importCSV() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.csv';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const text = await file.text();
                    const lines = text.split('\n').filter(l => l.trim());
                    if (lines.length < 2) { alert('CSV vacio o sin datos.'); return; }
                    const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
                    const rows = [];
                    for (let i = 1; i < lines.length; i++) {
                        const vals = lines[i].split(',');
                        const obj = {};
                        headers.forEach((h, idx) => { obj[h] = (vals[idx] || '').trim(); });
                        rows.push(obj);
                    }
                    if (typeof InvDB !== 'undefined' && InvDB.importBienes) {
                        await InvDB.importBienes(rows);
                        await loadBienes();
                        alert('Importados ' + rows.length + ' bienes.');
                    } else {
                        alert('Funcion de importacion no disponible.');
                    }
                } catch (err) {
                    console.error('CSV import error:', err);
                    alert('Error al importar CSV: ' + err.message);
                }
            };
            input.click();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadSelects();
            await loadBienes();
        });
    </script>
</body>
</html>
