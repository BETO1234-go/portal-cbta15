<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&Aacute;reas - Inventario Escolar</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="contenedor">
        <aside class="sidebar" id="mainSidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-copy">
                        <h2 title="Sistema de Inventario">Sistema de Inventario</h2>
                        <p id="userRole">Administrador</p>
                    </div>
                </div>
            </div>
            <nav class="sidebar-menu menu" aria-label="Menu principal">
                <a href="dashboard.html"><i class="fa-solid fa-table-columns"></i><span>Dashboard</span></a>
                <a href="bienes.html"><i class="fa-solid fa-cube"></i><span>Bienes</span></a>
                <a href="personal.html"><i class="fa-solid fa-users"></i><span>Personal</span></a>
                <a href="areas.html" class="activo"><i class="fa-solid fa-building"></i><span>&Aacute;reas</span></a>
                <a href="asignaciones.html"><i class="fa-solid fa-link"></i><span>Asignaciones</span></a>
                <a href="historial.html"><i class="fa-solid fa-clock-rotate-left"></i><span>Historial</span></a>
                <a href="reportes.html"><i class="fa-solid fa-chart-column"></i><span>Reportes</span></a>
                <a href="pendientes.html"><i class="fa-solid fa-circle-exclamation"></i><span>Pendientes</span></a>
                <a href="usuarios.html"><i class="fa-solid fa-user-gear"></i><span>Usuarios</span></a>
            </nav>
            <div class="sidebar-footer logout">
                <a href="#" onclick="toggleTheme(); return false;" style="cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                    <i class="fa-solid fa-palette"></i>
                    <span data-theme-label>Cambiar tema</span>
                </a>
                <a href="../login.html" onclick="invLogout();" style="display:flex;align-items:center;gap:10px;">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Cerrar sesi&oacute;n</span>
                </a>
            </div>
        </aside>
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
        <button class="hamburger-fixed" id="hamburgerFixed" onclick="toggleSidebar()" aria-label="Abrir menu">
            <i class="fa-solid fa-bars"></i>
        </button>

        <main class="contenido">
            <div class="header">
                <div>
                    <h1>&Aacute;reas</h1>
                    <p>Administra las &aacute;reas del instituto</p>
                </div>
                <div class="header-right">
                    <button class="btn-agregar admin-only" onclick="openAreaModal()">
                        <i class="fa-solid fa-plus"></i> Nueva &aacute;rea
                    </button>
                </div>
            </div>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre del &Aacute;rea</th>
                            <th>Descripci&oacute;n</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="areasBody">
                        <tr>
                            <td colspan="3" class="empty-state" style="text-align:center;padding:40px 20px;">
                                <i class="fa-solid fa-building" style="font-size:2.5rem;margin-bottom:12px;display:block;color:var(--muted);"></i>
                                <span style="color:var(--muted);">Cargando &aacute;reas...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="paginacion" id="paginationControls" style="padding:18px 22px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--table-border);"></div>
        </main>
    </div>

    <div class="component-modal" id="areaModal">
        <div class="component-modal-content">
            <div class="component-modal-header">
                <h2 id="modalTitle"><i class="fa-solid fa-plus-circle" style="color:var(--primary);margin-right:8px;"></i> Nueva &Aacute;rea</h2>
                <button class="component-modal-close" onclick="closeModal('areaModal')">&times;</button>
            </div>
            <div class="component-modal-body">
                <form id="areaForm" onsubmit="handleAreaSubmit(event)">
                    <input type="hidden" id="areaId">

                    <div class="form-group">
                        <label>Nombre del &Aacute;rea <span style="color:var(--danger);">*</span></label>
                        <input type="text" id="nombreArea" required placeholder="Ej. Direcci&oacute;n, Cocina, Laboratorio">
                    </div>

                    <div class="form-group">
                        <label>Descripci&oacute;n</label>
                        <textarea id="descripcion" rows="3" placeholder="Descripci&oacute;n del &aacute;rea..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Estatus</label>
                        <select id="estatus">
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                        </select>
                    </div>

                    <div class="component-modal-footer">
                        <button type="button" class="btn-secundario" onclick="closeModal('areaModal')">Cancelar</button>
                        <button type="submit" class="btn-agregar" id="btnSaveArea">
                            <i class="fa-solid fa-save"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="component-modal component-modal-sm" id="confirmModal">
        <div class="component-modal-content">
            <div class="component-modal-header">
                <h2 id="confirmModalTitle"><i class="fa-solid fa-circle-question" style="color:var(--warning);margin-right:8px;"></i> Confirmar</h2>
                <button class="component-modal-close" onclick="closeConfirmModal()">&times;</button>
            </div>
            <div class="component-modal-body">
                <p id="confirmModalMessage" style="color:var(--text);font-size:15px;"></p>
            </div>
            <div class="component-modal-footer">
                <button class="btn-secundario" onclick="closeConfirmModal()">Cancelar</button>
                <button class="btn-agregar" id="confirmModalBtn" style="background:var(--danger);border-color:var(--danger);">Confirmar</button>
            </div>
        </div>
    </div>

    <div class="component-modal component-modal-sm" id="alertModal">
        <div class="component-modal-content">
            <div class="component-modal-header">
                <h2 id="alertModalTitle"><i class="fa-solid fa-circle-info" style="color:var(--primary);margin-right:8px;"></i> Aviso</h2>
                <button class="component-modal-close" onclick="closeAlertModal()">&times;</button>
            </div>
            <div class="component-modal-body">
                <p id="alertModalMessage" style="color:var(--text);font-size:15px;"></p>
            </div>
            <div class="component-modal-footer">
                <button class="btn-agregar" onclick="closeAlertModal()">Aceptar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/app.js"></script>
    <script>
        var currentPage = 1;
        var perPage = 15;
        var allAreas = [];
        var searchTimeout = null;

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(function () {
                currentPage = 1;
                loadAreas();
            }, 300);
        }

        async function loadAreas() {
            document.getElementById('areasBody').innerHTML = '<tr><td colspan="3" style="text-align:center;padding:40px;color:var(--muted);"><i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;display:block;margin-bottom:8px;"></i>Cargando...</td></tr>';
            try {
                if (typeof requireInvAuth === 'function') {
                    await requireInvAuth();
                }

                var result = { data: [], total: 0 };

                if (typeof InvDB !== 'undefined' && InvDB.getAreas) {
                    result = await InvDB.getAreas(currentPage, perPage);
                }

                allAreas = result.data || [];
                renderAreas();
            } catch (err) {
                console.error('Error loading areas:', err);
                document.getElementById('areasBody').innerHTML =
                    '<tr><td colspan="3" class="empty-state" style="text-align:center;padding:40px 20px;">' +
                    '<i class="fa-solid fa-exclamation-triangle" style="font-size:2.5rem;margin-bottom:12px;display:block;color:var(--danger);"></i>' +
                    '<span style="color:var(--muted);">Error al cargar &aacute;reas</span></td></tr>';
            }
        }

        function renderAreas() {
            var tbody = document.getElementById('areasBody');

            if (allAreas.length === 0) {
                tbody.innerHTML =
                    '<tr><td colspan="3" class="empty-state" style="text-align:center;padding:40px 20px;">' +
                    '<i class="fa-solid fa-inbox" style="font-size:2.5rem;margin-bottom:12px;display:block;color:var(--muted);"></i>' +
                    '<span style="color:var(--muted);">No se encontraron &aacute;reas</span></td></tr>';
            } else {
                tbody.innerHTML = allAreas.map(function (a) {
                    var estatus = a.estatus || 'Activo';
                    var badgeClass = estatus === 'Activo' ? 'component-badge-success' : 'component-badge-warning';
                    return '<tr>' +
                        '<td><strong>' + (a.nombre_area || 'N/A') + '</strong></td>' +
                        '<td>' + (a.descripcion || '-') + '</td>' +
                        '<td class="acciones">' +
                            '<div class="acciones" style="display:flex;gap:4px;justify-content:center;flex-wrap:nowrap;">' +
                                '<button class="action-btn action-edit" title="Editar" onclick="editArea(\'' + a.id + '\')"><i class="fa-solid fa-pen"></i></button>' +
                                '<button class="action-btn action-danger" title="Eliminar" onclick="confirmDeleteArea(\'' + a.id + '\')"><i class="fa-solid fa-trash"></i></button>' +
                            '</div>' +
                        '</td>' +
                    '</tr>';
                }).join('');
            }

            renderPagination();
        }

        function renderPagination() {
            var container = document.getElementById('paginationControls');
            var total = allAreas.length;
            var totalPages = Math.ceil(total / perPage) || 1;

            var html = '<span style="color:var(--muted);font-size:14px;">P&aacute;gina ' + currentPage + ' de ' + totalPages + '</span>';
            html += '<div class="paginas">';

            html += '<button onclick="goToPage(' + (currentPage - 1) + ')"' + (currentPage <= 1 ? ' disabled' : '') + '><i class="fa-solid fa-chevron-left"></i></button>';

            for (var i = 1; i <= totalPages; i++) {
                if (totalPages <= 7 || Math.abs(i - currentPage) <= 1 || i === 1 || i === totalPages) {
                    html += '<button class="' + (i === currentPage ? 'pagina-activa' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
                } else if (i === 2 && currentPage > 4) {
                    html += '<button disabled>...</button>';
                } else if (i === totalPages - 1 && currentPage < totalPages - 3) {
                    html += '<button disabled>...</button>';
                }
            }

            html += '<button onclick="goToPage(' + (currentPage + 1) + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '><i class="fa-solid fa-chevron-right"></i></button>';
            html += '</div>';

            container.innerHTML = html;
        }

        function goToPage(page) {
            var total = allAreas.length;
            var totalPages = Math.ceil(total / perPage) || 1;
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderAreas();
            renderPagination();
        }

        function openAreaModal(area) {
            var form = document.getElementById('areaForm');
            var title = document.getElementById('modalTitle');
            form.reset();
            document.getElementById('areaId').value = '';

            if (area) {
                title.innerHTML = '<i class="fa-solid fa-pen" style="color:var(--primary);margin-right:8px;"></i> Editar &Aacute;rea';
                document.getElementById('areaId').value = area.id || '';
                document.getElementById('nombreArea').value = area.nombre_area || '';
                document.getElementById('descripcion').value = area.descripcion || '';
                document.getElementById('estatus').value = area.estatus || 'Activo';
            } else {
                title.innerHTML = '<i class="fa-solid fa-plus-circle" style="color:var(--primary);margin-right:8px;"></i> Nueva &Aacute;rea';
            }

            openModal('areaModal');
        }

        function editArea(id) {
            var area = allAreas.find(function (a) { return a.id == id; });
            if (area) {
                openAreaModal(area);
            }
        }

        function confirmDeleteArea(id) {
            showConfirm('\u00BFEst\u00E1s seguro de que deseas eliminar esta \u00E1rea? Esta acci\u00F3n no se puede deshacer.', function () {
                deleteArea(id);
            }, 'Eliminar \u00E1rea');
        }

        async function deleteArea(id) {
            try {
                if (typeof InvDB !== 'undefined' && InvDB.deleteArea) {
                    await InvDB.deleteArea(id);
                }
                showAlert('\u00E1rea eliminada correctamente.', '\u00C9xito');
                await loadAreas();
            } catch (err) {
                console.error('Error deleting area:', err);
                showAlert('Error al eliminar: ' + (err.message || 'Error desconocido'), 'Error');
            }
        }

        async function handleAreaSubmit(e) {
            e.preventDefault();
            var id = document.getElementById('areaId').value;
            var btn = document.getElementById('btnSaveArea');
            btn.disabled = true;

            var payload = {
                nombre_area: document.getElementById('nombreArea').value.trim(),
                descripcion: document.getElementById('descripcion').value.trim(),
                estatus: document.getElementById('estatus').value
            };

            try {
                if (typeof InvDB !== 'undefined') {
                    if (id && InvDB.updateArea) {
                        await InvDB.updateArea(id, payload);
                    } else if (InvDB.createArea) {
                        await InvDB.createArea(payload);
                    }
                }
                closeModal('areaModal');
                showAlert(id ? '\u00C1rea actualizada correctamente.' : '\u00C1rea creada correctamente.', '\u00C9xito');
                await loadAreas();
            } catch (err) {
                console.error('Error saving area:', err);
                showAlert('Error al guardar: ' + (err.message || 'Error desconocido'), 'Error');
            } finally {
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', loadAreas);
    </script>
</body>
</html>
