<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Escolar - CBTA 15</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        :root {
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --bg: #f0f2f5;
            --surface: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --danger: #dc2626;
        }
        body.dark {
            --primary: #4dabf7;
            --primary-hover: #339af0;
            --bg: #1a1a2e;
            --surface: #16213e;
            --text: #e4e6eb;
            --text-muted: #adb5bd;
            --border: #2d3748;
            --danger: #fc5c65;
        }
        .theme-toggle {
            position: fixed; top: 20px; right: 20px;
            background: var(--surface); border: 1px solid var(--border); color: var(--text);
            width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
            font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; z-index: 100;
        }
        .theme-toggle:hover { background: var(--primary); color: #fff; }
        .login-container { width: 100%; max-width: 420px; padding: 20px; }
        .login-card {
            background: var(--surface); border-radius: 16px; padding: 40px 36px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08); border: 1px solid var(--border);
        }
        .login-card .logo { text-align: center; margin-bottom: 8px; }
        .login-card .logo i { font-size: 3rem; color: var(--primary); }
        .login-card h1 { text-align: center; font-size: 1.6rem; margin-bottom: 4px; }
        .login-card .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 32px; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
        .form-group input {
            width: 100%; padding: 12px 14px; border: 1px solid var(--border);
            border-radius: 10px; font-size: 1rem; background: var(--bg); color: var(--text);
            outline: none; transition: border 0.3s;
        }
        .form-group input:focus { border-color: var(--primary); }
        .btn-login {
            width: 100%; padding: 13px; background: var(--primary); color: #fff;
            border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 600;
            cursor: pointer; transition: background 0.3s;
        }
        .btn-login:hover { background: var(--primary-hover); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg {
            background: #fef2f2; color: var(--danger); border: 1px solid #fecaca;
            border-radius: 10px; padding: 12px 16px; margin-bottom: 20px;
            display: none; font-size: 0.9rem; text-align: center;
        }
        body.dark .error-msg { background: rgba(252,92,101,0.1); border-color: rgba(252,92,101,0.3); }
        .links { text-align: center; margin-top: 24px; }
        .links a { display: block; color: var(--primary); text-decoration: none; font-size: 0.9rem; margin-bottom: 8px; }
        .links a:hover { text-decoration: underline; }
        .links a.back { color: var(--text-muted); }
        .spinner {
            display: inline-block; width: 18px; height: 18px;
            border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff;
            border-radius: 50%; animation: spin 0.7s linear infinite;
            vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema">
        <i class="fas fa-moon" id="themeIcon"></i>
    </button>

    <div class="login-container">
        <div class="login-card">
            <div class="logo"><i class="fas fa-boxes-stacked"></i></div>
            <h1>Inventario Escolar</h1>
            <p class="subtitle">Acceso al sistema de inventario</p>
            <div class="error-msg" id="errorMsg"></div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Correo Electronico</label>
                    <input type="email" id="email" placeholder="correo@ejemplo.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Contrasena</label>
                    <input type="password" id="password" placeholder="Tu contrasena" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login" id="btnLogin">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>
            <div class="links">
                <a href="../index.html" class="back"><i class="fas fa-arrow-left"></i> Volver al portal</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark');
            var icon = document.getElementById('themeIcon');
            var isDark = document.body.classList.contains('dark');
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('inv_theme', isDark ? 'dark' : 'light');
        }
        (function () {
            if (localStorage.getItem('inv_theme') === 'dark') {
                document.body.classList.add('dark');
                document.getElementById('themeIcon').className = 'fas fa-sun';
            }
        })();

        var INV_URL = 'https://fqfrqwyoehxakesfwhpw.supabase.co';
        var INV_KEY = 'sb_publishable_IdH-OaL4gU8rAIzhk3-iAw_ZIBsiTT1';
        var invClient = null;

        (function initClient() {
            try {
                var lib = window.supabase || window.Supabase;
                if (lib && typeof lib.createClient === 'function') {
                    invClient = lib.createClient(INV_URL, INV_KEY);
                    console.log('Inventario Supabase conectado');
                }
            } catch (e) {
                console.warn('initClient error:', e);
            }
        })();

        async function handleLogin(e) {
            e.preventDefault();
            var btn = document.getElementById('btnLogin');
            var errorEl = document.getElementById('errorMsg');
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            errorEl.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Entrando...';

            try {
                if (!invClient) {
                    throw new Error('No se pudo conectar al servidor');
                }
                var result = await invClient.auth.signInWithPassword({ email: email, password: password });
                if (result.error) {
                    errorEl.textContent = result.error.message;
                    errorEl.style.display = 'block';
                    return;
                }
                localStorage.setItem('inv_session', JSON.stringify(result.data.session));
                var perfilResult = await invClient.from('inv_usuarios').select('rol, nombre').eq('correo', email).single();
                var perfil = perfilResult.data;
                var user = {
                    id: result.data.user.id,
                    email: result.data.user.email,
                    nombre: (perfil && perfil.nombre) || result.data.user.email,
                    rol: (perfil && perfil.rol) || 'admin'
                };
                localStorage.setItem('inv_user', JSON.stringify(user));
                localStorage.setItem('inv_role', user.rol);
                window.location.href = 'admin/dashboard.html';
            } catch (err) {
                errorEl.textContent = err.message || 'Error al iniciar sesion.';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar';
            }
        }
    </script>
</body>
</html>
