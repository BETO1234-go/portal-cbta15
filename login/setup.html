<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Admin - CBTA 15</title>
    <script>
        (function () {
            var savedTheme = localStorage.getItem('inventario-theme');
            if (savedTheme === 'dark' || savedTheme === 'light') {
                document.documentElement.dataset.theme = savedTheme;
            }
        })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .setup-card { max-width: 500px; margin: 60px auto; padding: 32px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); }
        .setup-card h1 { font-size: 1.4rem; margin-bottom: 8px; }
        .setup-card .subtitle { color: var(--muted); margin-bottom: 24px; }
        .setup-card label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 0.85rem; }
        .setup-card input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--input-bg, #f9f9f9); font-size: 0.9rem; box-sizing: border-box; }
        .setup-card button { width: 100%; padding: 12px; margin-top: 20px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        .setup-card button:hover { opacity: 0.9; }
        .setup-card button:disabled { opacity: 0.5; cursor: not-allowed; }
        .result { margin-top: 16px; padding: 12px; border-radius: 6px; display: none; white-space: pre-wrap; font-size: 0.85rem; }
        .result.ok { background: #d4edda; color: #155724; display: block; }
        .result.err { background: #f8d7da; color: #721c24; display: block; }
        .result.loading { background: #fff3cd; color: #856404; display: block; }
    </style>
</head>
<body>
    <main class="page">
        <div class="setup-card">
            <h1><i class="fa-solid fa-user-shield"></i> Setup Admin</h1>
            <p class="subtitle">Crear primer usuario administrador.</p>

            <label for="email">Correo</label>
            <input type="email" id="email" value="admin@cbta15.edu.mx">

            <label for="password">Contrasena (min. 6 caracteres)</label>
            <input type="password" id="password" value="admin123">

            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" value="Administrador CBTA 15">

            <button id="btnSetup" onclick="setupAdmin()">Crear Admin</button>

            <div id="resultado" class="result"></div>

            <p style="margin-top:20px;text-align:center;">
                <a href="../login/personal.html" style="color:var(--primary);">Ir a Login &rarr;</a>
            </p>
        </div>
    </main>

    <script src="../js/supabase.js"></script>
    <script>
        function log(el, msg, type) {
            el.className = 'result ' + type;
            el.textContent = msg;
        }

        function withTimeout(promise, ms) {
            return Promise.race([
                promise,
                new Promise(function(_, reject) {
                    setTimeout(function() { reject(new Error('Tiempo de espera agotado (' + ms/1000 + 's). Supabase no responde. Verifica que el proyecto este activo en el dashboard.')); }, ms);
                })
            ]);
        }

        async function setupAdmin() {
            var el = document.getElementById('resultado');
            var btn = document.getElementById('btnSetup');
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var nombre = document.getElementById('nombre').value.trim();

            if (!email || !password || !nombre) {
                log(el, 'Todos los campos son requeridos', 'err');
                return;
            }
            if (password.length < 6) {
                log(el, 'La contrasena debe tener al menos 6 caracteres', 'err');
                return;
            }

            btn.disabled = true;

            if (!supabase) initSupabase();
            if (!supabase) {
                log(el, 'Error: No se pudo conectar a Supabase. Verifica la URL y Key.', 'err');
                btn.disabled = false;
                return;
            }

            // Step 1: Try direct login first
            log(el, 'Verificando credenciales...', 'loading');
            try {
                var existingCheck = await withTimeout(
                    supabase.auth.signInWithPassword({ email: email, password: password }),
                    10000
                );
                if (existingCheck.data && existingCheck.data.session) {
                    localStorage.setItem('supabase_user', JSON.stringify({
                        id: existingCheck.data.user.id,
                        email: existingCheck.data.user.email,
                        nombre: nombre,
                        rol: 'administrador'
                    }));
                    localStorage.setItem('supabase_role', 'administrador');
                    localStorage.setItem('supabase_session', JSON.stringify(existingCheck.data.session));
                    log(el, 'Usuario ya existe. Redirigiendo...', 'ok');
                    setTimeout(function() { window.location.href = '../admin/reportes.html'; }, 1000);
                    btn.disabled = false;
                    return;
                }
                await supabase.auth.signOut();
            } catch(e) {
                console.log('Login check:', e.message);
            }

            // Step 2: Create auth user
            log(el, 'Creando usuario en Supabase Auth...', 'loading');
            var signUpResult;
            try {
                signUpResult = await withTimeout(
                    supabase.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: { nombre_completo: nombre, rol: 'administrador' }
                        }
                    }),
                    15000
                );
            } catch(e) {
                log(el, 'Error: ' + e.message, 'err');
                btn.disabled = false;
                return;
            }

            var data = signUpResult.data;
            var error = signUpResult.error;

            if (error) {
                if (error.message.includes('already registered') || error.message.includes('already been registered')) {
                    log(el, 'Este correo ya esta registrado.\nSi no puedes iniciar sesion, ve al dashboard de Supabase > Authentication > Users y borra este usuario, luego vuelve a intentar.', 'err');
                } else {
                    log(el, 'Error Auth: ' + error.message, 'err');
                }
                btn.disabled = false;
                return;
            }

            if (data && data.user && data.user.identities && data.user.identities.length === 0) {
                log(el, 'Este correo ya esta registrado.\nVe al login o usa otro email.', 'err');
                btn.disabled = false;
                return;
            }

            // Step 3: Insert profile
            log(el, 'Guardando perfil...', 'loading');
            if (data && data.user) {
                try {
                    await supabase.from('usuarios').upsert({
                        id: data.user.id,
                        correo: email,
                        nombre_completo: nombre,
                        rol: 'administrador',
                        activo: true
                    }, { onConflict: 'id' });
                } catch(e) {
                    console.warn('usuarios warning:', e);
                }
            }

            if (data && data.session) {
                localStorage.setItem('supabase_user', JSON.stringify({
                    id: data.user.id,
                    email: data.user.email,
                    nombre: nombre,
                    rol: 'administrador'
                }));
                localStorage.setItem('supabase_role', 'administrador');
                localStorage.setItem('supabase_session', JSON.stringify(data.session));
                log(el, 'Admin creado. Redirigiendo...', 'ok');
                setTimeout(function() { window.location.href = '../admin/reportes.html'; }, 1000);
            } else {
                log(el, 'Admin creado pero Supabase requiere confirmacion por correo.\nRevisa: ' + email + '\n\nSi no recibes correo, ve a Supabase Dashboard > Authentication > Providers > Email y desactiva "Confirm email".', 'ok');
            }

            btn.disabled = false;
        }
    </script>
</body>
</html>
