<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Alumno | CBTA 15</title>
    <script>
        (function () {
            var t = localStorage.getItem('portal-theme');
            if (t === 'dark') document.documentElement.dataset.theme = 'dark';
        })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <button type="button" class="hamburger-fixed" onclick="toggleThemeLogin(); return false;" aria-label="Cambiar tema" style="top:12px;left:auto;right:12px;">
        <i class="fa-solid fa-palette"></i>
    </button>
    <main class="page">
        <section class="card login-card admin-card">
            <p class="badge">Acceso Alumno</p>
            <h1>Portal de Alumno</h1>
            <p class="subtitle">Ingresa solo con tu matricula.</p>

            <div id="loginError" class="alert" style="display:none;"></div>

            <form id="loginForm" class="form import-form">
                <label for="matricula">Matricula</label>
                <input type="text" name="matricula" id="matricula" required autocomplete="off">
                <button type="submit">Entrar como alumno</button>
            </form>

            <div class="actions-row">
                <a class="text-link" href="../index.html">Volver</a>
                <a class="text-link" href="personal.html">Soy personal</a>
            </div>
        </section>
    </main>
    <script>
        function toggleThemeLogin() {
            var root = document.documentElement;
            var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
            root.dataset.theme = next;
            localStorage.setItem('portal-theme', next);
        }

    </script>
    <script src="../js/supabase.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var matricula = document.getElementById('matricula').value;
            var err = document.getElementById('loginError');

            if (!matricula) {
                err.textContent = 'La matricula es requerida';
                err.style.display = 'block';
                return;
            }

            var result = await supabaseLoginAlumno(matricula);
            if (result.error) {
                err.textContent = result.error;
                err.style.display = 'block';
            } else {
                window.location.href = '../alumno/dashboard.html';
            }
        });
    </script>
</body>
</html>
