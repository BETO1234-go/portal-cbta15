<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Personal | CBTA 15</title>
    <script>
        (function () {
            var savedTheme = localStorage.getItem('inventario-theme');
            if (savedTheme === 'dark' || savedTheme === 'light') {
                document.documentElement.dataset.theme = savedTheme;
            }
        })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <button type="button" class="hamburger-fixed" onclick="toggleThemeLogin(); return false;" aria-label="Cambiar tema" style="top:12px;left:auto;right:12px;">
        <i class="fa-solid fa-palette"></i>
    </button>
    <main class="page">
        <section class="card login-card admin-card">
            <p class="badge">Acceso Personal</p>
            <h1>Administradores y Maestros</h1>
            <p class="subtitle">Ingresa con correo institucional interno y contrasena.</p>

            <div id="loginError" class="alert" style="display:none;"></div>

            <form id="loginForm" class="form import-form">
                <label for="correo">Correo</label>
                <input type="email" name="correo" id="correo" required autocomplete="off">

                <label for="password">Contrasena</label>
                <input type="password" name="password" id="password" required>

                <button type="submit">Entrar como personal</button>
            </form>

            <div class="actions-row">
                <a class="text-link" href="../index.html">Volver</a>
                <a class="text-link" href="alumno.html">Soy alumno</a>
            </div>
        </section>
    </main>
    <script>
        function toggleThemeLogin() {
            var root = document.documentElement;
            var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
            root.dataset.theme = next;
            localStorage.setItem('inventario-theme', next);
        }

    </script>
    <script src="../js/supabase.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var correo = document.getElementById('correo').value;
            var pass = document.getElementById('password').value;
            var err = document.getElementById('loginError');

            if (!correo || !pass) {
                err.textContent = 'Correo y contrasena son requeridos';
                err.style.display = 'block';
                return;
            }

            err.style.display = 'none';
            err.textContent = 'Conectando...';
            err.style.display = 'block';
            err.style.background = '#fff3cd';
            err.style.color = '#856404';

            try {
                var result = await supabaseLogin(correo, pass);
                if (result.error) {
                    err.textContent = 'Error: ' + result.error;
                    err.style.background = '#f8d7da';
                    err.style.color = '#721c24';
                    err.style.display = 'block';
                } else {
                    err.textContent = 'Inicio de sesion exitoso. Redirigiendo...';
                    err.style.background = '#d4edda';
                    err.style.color = '#155724';
                    setTimeout(function() {
                        window.location.href = '../admin/reportes.html';
                    }, 500);
                }
            } catch(ex) {
                err.textContent = 'Error inesperado: ' + ex.message;
                err.style.background = '#f8d7da';
                err.style.color = '#721c24';
                err.style.display = 'block';
            }
        });
    </script>
</body>
</html>
